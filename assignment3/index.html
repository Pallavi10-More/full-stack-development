<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fashion Store</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-custom px-4">
        <a class="navbar-brand" href="#">Fashion Store</a>
        <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#cartModal">
            Cart 🛒 <span id="cart-count">0</span>
        </button>
        <div class="ms-auto d-flex gap-3 align-items-center">
            <a class="nav-link" href="#">Home</a>
            <a class="nav-link" href="#">Shop</a>
            <a class="nav-link" href="#">Services</a>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero py-5">
        <div class="container text-center">
            <h1 class="display-4 text-white">Welcome to Fashion Hub</h1>
            <p class="lead text-white-50">Discover the latest trends and timeless pieces curated just for you.</p>
            <a href="#product-list" class="btn btn-light btn-lg text-dark">Shop Now</a>
        </div>
    </header>

    <!-- Featured Collection -->
    <section class="container mt-5">
        <h2 class="text-center mb-4">Featured Collection</h2>
        <div class="row" id="product-list">
            <!-- Products will be dynamically added here -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <small>&copy; 2026 Fashion Store. All rights reserved.</small>
        </div>
    </footer>

    <!-- Cart Modal -->
    <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cartModalLabel">Your Cart</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="cart-items">
                        <!-- Cart items will be displayed here -->
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <strong>Total:</strong>
                        <strong id="cart-total">0</strong>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="checkout()">Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->
    <script src="script.js"></script>
</body>

</html>
